services:
  - type: web
    name: querywise-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SLOW_QUERY_THRESHOLD_MS
        value: "500"
      - key: TARGET_DATABASE_URL
        sync: false
      - key: APP_DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
